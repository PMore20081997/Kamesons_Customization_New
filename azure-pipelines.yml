trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
  persistCredentials: true

- script: |
    git remote remove github 2>/dev/null || true
    git remote add github https://x-access-token:$(GitHub_PAT)@github.com/PMore20081997/Kamesons_Customization_New.git
    git push github HEAD:main --force
  displayName: 'Sync to GitHub'


