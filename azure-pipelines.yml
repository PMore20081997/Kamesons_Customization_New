trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
  persistCredentials: true

- script: |
    # 1. Clean up and add the remote
    git remote remove github 2>/dev/null || true
    git remote add github https://x-access-token:$(GitHub_PAT)@://github.com
    
    # 2. Specifically push the 'main' branch
    # If your Azure branch is named something else, replace 'main' below
    git push github main --force
  displayName: 'Sync to GitHub'

